{% extends 'base.html' %}{% block content %}<h1>고객 입력</h1><section class="card"><form method="post" class="formgrid"><label>날짜<input type="date" name="date" value="{{today}}"></label><label>방문시간<input type="time" name="visit_time" value="{{now_time}}"></label><label>거래유형<select name="transaction_type"><option>결제</option><option>시술</option><option>환불</option><option>기타</option></select></label><label>고객구분<select name="customer_type"><option value="">선택</option><option>신규</option><option>구환</option></select></label><label>성별<select name="gender"><option value="">선택</option><option>남</option><option>여</option></select></label><label>고객명<input name="customer_name" required></label><label>카드<input class="amount" name="card_amount" type="number" min="0" value="0"></label><label>현금<input class="amount" name="cash_amount" type="number" min="0" value="0"></label><label>계좌이체<input class="amount" name="transfer_amount" type="number" min="0" value="0"></label><label>충전금 사용<input class="amount" name="credit_amount" type="number" min="0" value="0"></label><label class="wide">비고<input name="memo"></label><div class="wide totalbox">입력 합계: <b id="amountTotal">0</b>원</div><button>저장</button></form></section><section class="card"><h2>최근 고객 입력</h2><table><tr><th>날짜</th><th>시간</th><th>유형</th><th>고객명</th><th>카드</th><th>현금</th><th>계좌</th><th>입력자</th></tr>{% for r in records %}<tr><td>{{r.date}}</td><td>{{r.visit_time}}</td><td>{{r.transaction_type}}</td><td>{{r.customer_name}}</td><td>{{r.card_amount|money}}</td><td>{{r.cash_amount|money}}</td><td>{{r.transfer_amount|money}}</td><td>{{r.created_by}}</td></tr>{% endfor %}</table></section>{% endblock %}
