{% extends 'base.html' %}{% block content %}<h1>화장품 재고</h1><section class="card"><form method="post" class="formgrid"><label>제품명<input name="product_name" required></label><label>수량<input id="stockQty" name="stock_quantity" type="number" min="0" value="0"></label><label>단가<input id="unitPrice" name="unit_price" type="number" min="0" value="0"></label><label>총 금액<input id="totalAmount" name="total_amount" type="number" min="0" value="0"></label><label class="wide">비고<input name="memo"></label><p class="wide hint">수량+단가 입력 시 총 금액 자동 계산, 수량+총 금액 입력 시 단가 자동 계산</p><button>재고 저장</button></form></section><section class="card"><h2>재고 목록</h2><table><tr><th>제품명</th><th>수량</th><th>단가</th><th>총금액</th><th>비고</th></tr>{% for p in products %}<tr><td>{{p.product_name}}</td><td>{{p.stock_quantity}}</td><td>{{p.unit_price|money}}</td><td>{{p.total_amount|money}}</td><td>{{p.memo}}</td></tr>{% endfor %}</table></section>{% endblock %}
