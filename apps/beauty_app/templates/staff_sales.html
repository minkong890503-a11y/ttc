{% extends 'base.html' %}{% block content %}<h1>직원매출현황</h1><form class="inline"><input type="date" name="start_date" value="{{start_date}}"><input type="date" name="end_date" value="{{end_date}}"><button>조회</button></form><section class="card"><table><tr><th>직원명</th><th>시술매출</th><th>화장품매출</th><th>총매출</th></tr>{% for r in rows %}<tr><td>{{r.staff_name}}</td><td>{{r.treatment_sales|money}}</td><td>{{r.cosmetic_sales|money}}</td><td>{{r.total_sales|money}}</td></tr>{% endfor %}</table></section>{% endblock %}
