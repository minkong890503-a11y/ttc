{% extends 'base.html' %}{% block content %}<h1>화장품 판매 입력</h1><section class="card"><form method="post" id="cosmeticForm" class="formgrid"><input type="hidden" name="items_json" id="itemsJson"><label>날짜<input type="date" name="date" value="{{today}}"></label><label>직원명<input name="staff_name" value="{{session.user_name}}"></label><label>고객명<input name="customer_name"></label><div class="wide"><h3>판매 제품</h3><div id="items"></div><button type="button" class="btn" id="addItem">제품 추가</button><div class="totalbox">제품 합계: <b id="itemTotal">0</b>원</div></div><label>카드<input class="amount" name="card_amount" type="number" min="0" value="0"></label><label>현금<input class="amount" name="cash_amount" type="number" min="0" value="0"></label><label>계좌이체<input class="amount" name="transfer_amount" type="number" min="0" value="0"></label><label>충전금<input class="amount" name="credit_amount" type="number" min="0" value="0"></label><label class="wide">비고<input name="memo"></label><button>판매 저장</button></form></section><script id="productsData" type="application/json">{{products_json|safe}}</script><section class="card"><h2>최근 판매</h2><table><tr><th>날짜</th><th>직원</th><th>고객</th><th>제품</th><th>수량</th><th>카드</th><th>현금</th></tr>{% for s in sales %}<tr><td>{{s.date}}</td><td>{{s.staff_name}}</td><td>{{s.customer_name}}</td><td>{{s.product_name}}</td><td>{{s.quantity}}</td><td>{{s.card_amount|money}}</td><td>{{s.cash_amount|money}}</td></tr>{% endfor %}</table></section>{% endblock %}
