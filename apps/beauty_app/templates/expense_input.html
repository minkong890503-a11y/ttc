{% extends 'base.html' %}{% block content %}<h1>지출 입력</h1><section class="card"><form method="post" class="formgrid"><label>날짜<input type="date" name="date" value="{{today}}"></label><label>지출 항목<input name="category" required></label><label class="wide">지출 내용<input name="description" required></label><label>카드지출<input class="expenseAmount" name="card_amount" type="number" min="0" value="0"></label><label>현금지출<input class="expenseAmount" name="cash_amount" type="number" min="0" value="0"></label><div class="totalbox">총지출: <b id="expenseTotal">0</b>원</div><label class="wide">비고<input name="memo"></label><button>저장</button></form></section><section class="card"><h2>최근 지출</h2><table><tr><th>날짜</th><th>항목</th><th>내용</th><th>카드</th><th>현금</th><th>입력자</th></tr>{% for e in expenses %}<tr><td>{{e.date}}</td><td>{{e.category}}</td><td>{{e.description}}</td><td>{{e.card_amount|money}}</td><td>{{e.cash_amount|money}}</td><td>{{e.created_by}}</td></tr>{% endfor %}</table></section>{% endblock %}
